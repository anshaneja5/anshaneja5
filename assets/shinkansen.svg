<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 260" font-family="'Segoe UI', 'Hiragino Sans', sans-serif">
  <defs>
    <linearGradient id="bg2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="100%" stop-color="#161b33"/>
    </linearGradient>
    <linearGradient id="trainBody" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f8f9fa"/>
      <stop offset="100%" stop-color="#ced4da"/>
    </linearGradient>
  </defs>

  <style>
    .train { animation: ride 14s linear infinite; }
    @keyframes ride {
      0%   { transform: translateX(-160px); }
      100% { transform: translateX(1060px); }
    }
    .stationPulse { animation: sp 2s ease-in-out infinite; transform-origin: center; transform-box: fill-box; }
    @keyframes sp { 0%,100% { opacity:.5 } 50% { opacity:1 } }
    .speedline { animation: dashmove 1s linear infinite; }
    @keyframes dashmove { to { stroke-dashoffset: -60; } }
  </style>

  <rect width="1000" height="260" fill="url(#bg2)" rx="12"/>

  <text x="500" y="36" text-anchor="middle" font-size="19" fill="#e6edf3" font-weight="700" letter-spacing="3">🚅 山手線 — THE CAREER LINE</text>
  <text x="500" y="56" text-anchor="middle" font-size="11" fill="#8b949e" letter-spacing="2">ALL TRAINS RUN ON TIME. SO DO MY DEADLINES.</text>

  <!-- track -->
  <line x1="40" y1="150" x2="960" y2="150" stroke="#30363d" stroke-width="8" stroke-linecap="round"/>
  <line class="speedline" x1="40" y1="150" x2="960" y2="150" stroke="#4cc9f0" stroke-width="3" stroke-linecap="round" stroke-dasharray="18 42"/>

  <!-- stations -->
  <g text-anchor="middle">
    <g>
      <circle class="stationPulse" cx="110" cy="150" r="13" fill="none" stroke="#ff6ec7" stroke-width="2"/>
      <circle cx="110" cy="150" r="7" fill="#ff6ec7"/>
      <text x="110" y="185" font-size="13" fill="#e6edf3" font-weight="700">DTU 駅</text>
      <text x="110" y="202" font-size="10.5" fill="#8b949e">B.Tech CSE · 8.59</text>
      <text x="110" y="216" font-size="10.5" fill="#8b949e">2022 →</text>
    </g>
    <g>
      <circle class="stationPulse" cx="310" cy="150" r="13" fill="none" stroke="#ffd166" stroke-width="2" style="animation-delay:-.4s"/>
      <circle cx="310" cy="150" r="7" fill="#ffd166"/>
      <text x="310" y="185" font-size="13" fill="#e6edf3" font-weight="700">BACHATT 駅</text>
      <text x="310" y="202" font-size="10.5" fill="#8b949e">RAG on AWS</text>
      <text x="310" y="216" font-size="10.5" fill="#8b949e">−36% support tickets</text>
    </g>
    <g>
      <circle class="stationPulse" cx="510" cy="150" r="13" fill="none" stroke="#f85d7f" stroke-width="2" style="animation-delay:-.8s"/>
      <circle cx="510" cy="150" r="7" fill="#f85d7f"/>
      <text x="510" y="185" font-size="13" fill="#e6edf3" font-weight="700">ENGIMATCH 駅</text>
      <text x="510" y="202" font-size="10.5" fill="#8b949e">3K users · 500K views</text>
      <text x="510" y="216" font-size="10.5" fill="#8b949e">in 3 days</text>
    </g>
    <g>
      <circle class="stationPulse" cx="710" cy="150" r="13" fill="none" stroke="#c3e88d" stroke-width="2" style="animation-delay:-1.2s"/>
      <circle cx="710" cy="150" r="7" fill="#c3e88d"/>
      <text x="710" y="185" font-size="13" fill="#e6edf3" font-weight="700">MLDL.STUDY 駅</text>
      <text x="710" y="202" font-size="10.5" fill="#8b949e">23K learners · 150+ countries</text>
      <text x="710" y="216" font-size="10.5" fill="#8b949e">⭐ 370+</text>
    </g>
    <g>
      <circle class="stationPulse" cx="895" cy="150" r="16" fill="none" stroke="#4cc9f0" stroke-width="3" style="animation-delay:-1.6s"/>
      <circle cx="895" cy="150" r="9" fill="#4cc9f0"/>
      <text x="895" y="185" font-size="13" fill="#e6edf3" font-weight="700">RIMO・東京 ⛩️</text>
      <text x="895" y="202" font-size="10.5" fill="#8b949e">2M+ chars/mo · 50 langs</text>
      <text x="895" y="216" font-size="10.5" fill="#4cc9f0" font-weight="700">◉ YOU ARE HERE</text>
    </g>
  </g>

  <!-- shinkansen -->
  <g class="train">
    <g transform="translate(0,108)">
      <!-- body -->
      <path d="M8,26 Q8,10 30,8 L110,8 Q126,8 132,18 L140,26 Q141,32 132,32 L14,32 Q8,32 8,26 Z" fill="url(#trainBody)"/>
      <!-- nose stripe -->
      <path d="M110,8 Q126,8 132,18 L140,26 Q141,32 132,32 L114,32 Z" fill="#4cc9f0" opacity=".85"/>
      <!-- blue stripe -->
      <rect x="10" y="18" width="104" height="5" fill="#2563eb" rx="2"/>
      <!-- windows -->
      <rect x="20" y="11" width="12" height="6" rx="2" fill="#0d1117"/>
      <rect x="38" y="11" width="12" height="6" rx="2" fill="#0d1117"/>
      <rect x="56" y="11" width="12" height="6" rx="2" fill="#0d1117"/>
      <rect x="74" y="11" width="12" height="6" rx="2" fill="#0d1117"/>
      <rect x="92" y="11" width="12" height="6" rx="2" fill="#0d1117"/>
      <!-- headlight beam -->
      <path d="M138,24 L170,18 L170,30 Z" fill="#ffd166" opacity=".35"/>
      <!-- speed lines -->
      <line x1="-6"  y1="14" x2="-30" y2="14" stroke="#4cc9f0" stroke-width="2" opacity=".6"/>
      <line x1="-2"  y1="22" x2="-38" y2="22" stroke="#4cc9f0" stroke-width="2" opacity=".4"/>
      <line x1="-6"  y1="30" x2="-26" y2="30" stroke="#4cc9f0" stroke-width="2" opacity=".5"/>
    </g>
  </g>
</svg>
