<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 420" font-family="'Segoe UI', 'Hiragino Sans', sans-serif">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#05010f"/>
      <stop offset="55%" stop-color="#140a33"/>
      <stop offset="100%" stop-color="#2b1055"/>
    </linearGradient>
    <linearGradient id="fuji" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4a3f7a"/>
      <stop offset="100%" stop-color="#1b1440"/>
    </linearGradient>
    <linearGradient id="neonName" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ff6ec7"/>
      <stop offset="50%" stop-color="#ffd166"/>
      <stop offset="100%" stop-color="#4cc9f0"/>
    </linearGradient>
    <radialGradient id="moonGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#fff7d6" stop-opacity="0.9"/>
      <stop offset="60%" stop-color="#fff7d6" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#fff7d6" stop-opacity="0"/>
    </radialGradient>
    <path id="petal" d="M0,0 C4,-6 10,-4 9,2 C8,8 2,10 -1,6 C-3,3 -2,2 0,0 Z"/>
  </defs>

  <style>
    .star { animation: twinkle 3s ease-in-out infinite; }
    @keyframes twinkle { 0%,100% { opacity:.25 } 50% { opacity:1 } }

    .neon  { animation: flicker 4s linear infinite; }
    @keyframes flicker {
      0%,100% { opacity:1 } 92% { opacity:1 } 93% { opacity:.4 }
      94% { opacity:1 } 96% { opacity:.5 } 97% { opacity:1 }
    }
    .glowPulse { animation: pulse 5s ease-in-out infinite; }
    @keyframes pulse { 0%,100% { opacity:.75 } 50% { opacity:1 } }

    .fall  { animation: fall linear infinite; }
    .sway  { animation: sway ease-in-out infinite alternate; }
    .spin  { animation: spin linear infinite; transform-origin: center; }
    @keyframes fall { from { transform: translateY(-40px) } to { transform: translateY(470px) } }
    @keyframes sway { from { transform: translateX(-18px) } to { transform: translateX(18px) } }
    @keyframes spin { from { transform: rotate(0deg) } to { transform: rotate(360deg) } }

    .lanternSwing { animation: lantern 4s ease-in-out infinite alternate; transform-origin: top center; }
    @keyframes lantern { from { transform: rotate(-4deg) } to { transform: rotate(4deg) } }

    .windowBlink { animation: winblink 2.2s steps(2) infinite; }
    @keyframes winblink { 0%,100% { opacity:.9 } 50% { opacity:.25 } }
  </style>

  <!-- sky -->
  <rect width="1000" height="420" fill="url(#sky)"/>

  <!-- stars -->
  <g fill="#ffffff">
    <circle class="star" cx="80"  cy="50"  r="1.6" style="animation-delay:-1s"/>
    <circle class="star" cx="180" cy="90"  r="1.2" style="animation-delay:-2s"/>
    <circle class="star" cx="300" cy="40"  r="1.8" style="animation-delay:-.5s"/>
    <circle class="star" cx="420" cy="110" r="1.1" style="animation-delay:-2.6s"/>
    <circle class="star" cx="560" cy="60"  r="1.5" style="animation-delay:-1.4s"/>
    <circle class="star" cx="700" cy="95"  r="1.3" style="animation-delay:-.8s"/>
    <circle class="star" cx="930" cy="70"  r="1.7" style="animation-delay:-2.2s"/>
    <circle class="star" cx="640" cy="150" r="1.0" style="animation-delay:-1.8s"/>
    <circle class="star" cx="120" cy="160" r="1.2" style="animation-delay:-3s"/>
    <circle class="star" cx="860" cy="140" r="1.4" style="animation-delay:-.3s"/>
  </g>

  <!-- moon -->
  <circle cx="840" cy="90" r="90" fill="url(#moonGlow)"/>
  <circle cx="840" cy="90" r="34" fill="#fff3c4"/>
  <circle cx="830" cy="82" r="6" fill="#f3e3a8"/>
  <circle cx="852" cy="100" r="4" fill="#f3e3a8"/>

  <!-- Mt Fuji -->
  <path d="M330,330 L500,150 L540,190 L560,165 L580,192 L620,155 L790,330 Z" fill="url(#fuji)"/>
  <path d="M500,150 L540,190 L560,165 L580,192 L620,155 L648,185 C610,215 560,208 540,222 C515,205 490,212 472,182 Z" fill="#efe9ff"/>

  <!-- city skyline -->
  <g fill="#0e0a26">
    <rect x="0"   y="250" width="70"  height="170"/>
    <rect x="80"  y="285" width="55"  height="135"/>
    <rect x="145" y="235" width="65"  height="185"/>
    <rect x="770" y="270" width="60"  height="150"/>
    <rect x="840" y="240" width="75"  height="180"/>
    <rect x="925" y="290" width="75"  height="130"/>
  </g>
  <!-- tokyo tower -->
  <g>
    <path d="M900,150 L885,290 L915,290 Z" fill="#3d1533"/>
    <path d="M900,150 L893,215 L907,215 Z" fill="#ff5d8f" opacity=".8"/>
    <rect x="886" y="225" width="28" height="5" fill="#ff5d8f" opacity=".7"/>
    <circle class="star" cx="900" cy="148" r="3" fill="#ff2e63"/>
  </g>
  <!-- windows -->
  <g fill="#ffd166">
    <rect class="windowBlink" x="12"  y="265" width="7" height="9"/>
    <rect class="windowBlink" x="34"  y="290" width="7" height="9" style="animation-delay:-.7s"/>
    <rect class="windowBlink" x="50"  y="320" width="7" height="9" style="animation-delay:-1.3s"/>
    <rect class="windowBlink" x="92"  y="300" width="7" height="9" style="animation-delay:-.4s"/>
    <rect class="windowBlink" x="112" y="330" width="7" height="9" style="animation-delay:-1.7s"/>
    <rect class="windowBlink" x="158" y="250" width="7" height="9" style="animation-delay:-.9s"/>
    <rect class="windowBlink" x="180" y="280" width="7" height="9" style="animation-delay:-1.5s"/>
    <rect class="windowBlink" x="782" y="285" width="7" height="9" style="animation-delay:-.2s"/>
    <rect class="windowBlink" x="806" y="315" width="7" height="9" style="animation-delay:-1.1s"/>
    <rect class="windowBlink" x="856" y="255" width="7" height="9" style="animation-delay:-.6s"/>
    <rect class="windowBlink" x="882" y="300" width="7" height="9" style="animation-delay:-1.9s"/>
    <rect class="windowBlink" x="940" y="305" width="7" height="9" style="animation-delay:-.8s"/>
    <rect class="windowBlink" x="965" y="335" width="7" height="9" style="animation-delay:-1.4s"/>
  </g>

  <!-- torii gate -->
  <g stroke="#e63946" stroke-width="0" fill="#c1121f">
    <path d="M180,190 Q345,168 510,190 L510,205 Q345,184 180,205 Z"/>
    <rect x="205" y="205" width="280" height="12" fill="#d62828"/>
    <rect x="228" y="205" width="18" height="215" fill="#9d0208"/>
    <rect x="444" y="205" width="18" height="215" fill="#9d0208"/>
    <rect x="222" y="410" width="30" height="10" fill="#6a040f"/>
    <rect x="438" y="410" width="30" height="10" fill="#6a040f"/>
  </g>

  <!-- hanging lantern -->
  <g class="lanternSwing" style="transform-box: fill-box;">
    <line x1="345" y1="217" x2="345" y2="240" stroke="#3a2c1a" stroke-width="2"/>
    <ellipse cx="345" cy="262" rx="17" ry="22" fill="#ff9e2c" class="glowPulse"/>
    <ellipse cx="345" cy="262" rx="17" ry="22" fill="none" stroke="#7f4f24" stroke-width="1.5"/>
    <line x1="331" y1="254" x2="359" y2="254" stroke="#7f4f24" stroke-width="1"/>
    <line x1="329" y1="262" x2="361" y2="262" stroke="#7f4f24" stroke-width="1"/>
    <line x1="331" y1="270" x2="359" y2="270" stroke="#7f4f24" stroke-width="1"/>
    <text x="345" y="268" text-anchor="middle" font-size="12" fill="#6a040f" font-weight="bold">縁</text>
  </g>

  <!-- neon name -->
  <g class="neon">
    <text x="345" y="330" text-anchor="middle" font-size="52" font-weight="800" fill="url(#neonName)" letter-spacing="4">ANSH ANEJA</text>
    <text x="345" y="330" text-anchor="middle" font-size="52" font-weight="800" fill="none" stroke="#ff6ec7" stroke-opacity=".35" stroke-width="6" letter-spacing="4">ANSH ANEJA</text>
  </g>
  <text class="glowPulse" x="345" y="362" text-anchor="middle" font-size="17" fill="#4cc9f0" letter-spacing="6">アンシュ・アネジャ</text>
  <text x="345" y="392" text-anchor="middle" font-size="14" fill="#b8b8d1" letter-spacing="2">AI ENGINEER · NEW DELHI ⇄ TOKYO · SHIPS TO PRODUCTION</text>

  <!-- vertical kanji neon sign -->
  <g class="neon" style="animation-delay:-2s">
    <rect x="945" y="150" width="34" height="150" rx="6" fill="#0e0a26" stroke="#ff2e63" stroke-width="1.5"/>
    <text x="962" y="180" text-anchor="middle" font-size="20" fill="#ff2e63" font-weight="bold">開</text>
    <text x="962" y="212" text-anchor="middle" font-size="20" fill="#ffd166" font-weight="bold">発</text>
    <text x="962" y="244" text-anchor="middle" font-size="20" fill="#4cc9f0" font-weight="bold">中</text>
    <text x="962" y="280" text-anchor="middle" font-size="11" fill="#b8b8d1">24/7</text>
  </g>

  <!-- falling sakura petals -->
  <g fill="#ffb7d5">
    <g class="fall" style="animation-duration:9s;  animation-delay:-2s"><g class="sway" style="animation-duration:2.8s"><g class="spin" style="animation-duration:5s"><use href="#petal" x="100" y="0"/></g></g></g>
    <g class="fall" style="animation-duration:11s; animation-delay:-7s"><g class="sway" style="animation-duration:3.4s"><g class="spin" style="animation-duration:7s"><use href="#petal" x="240" y="0"/></g></g></g>
    <g class="fall" style="animation-duration:8s;  animation-delay:-4s"><g class="sway" style="animation-duration:2.2s"><g class="spin" style="animation-duration:4s"><use href="#petal" x="390" y="0"/></g></g></g>
    <g class="fall" style="animation-duration:12s; animation-delay:-9s"><g class="sway" style="animation-duration:3.8s"><g class="spin" style="animation-duration:6s"><use href="#petal" x="520" y="0"/></g></g></g>
    <g class="fall" style="animation-duration:10s; animation-delay:-1s"><g class="sway" style="animation-duration:2.6s"><g class="spin" style="animation-duration:5.5s"><use href="#petal" x="660" y="0"/></g></g></g>
    <g class="fall" style="animation-duration:9.5s;animation-delay:-6s"><g class="sway" style="animation-duration:3.1s"><g class="spin" style="animation-duration:4.5s"><use href="#petal" x="800" y="0"/></g></g></g>
    <g class="fall" style="animation-duration:13s; animation-delay:-3s"><g class="sway" style="animation-duration:2.9s"><g class="spin" style="animation-duration:8s"><use href="#petal" x="930" y="0"/></g></g></g>
    <g class="fall" style="animation-duration:8.5s;animation-delay:-5s"><g class="sway" style="animation-duration:2.4s"><g class="spin" style="animation-duration:5s"><use href="#petal" x="60"  y="0"/></g></g></g>
    <g fill="#ff8fb8">
      <g class="fall" style="animation-duration:10.5s;animation-delay:-8s"><g class="sway" style="animation-duration:3s"><g class="spin" style="animation-duration:6s"><use href="#petal" x="320" y="0"/></g></g></g>
      <g class="fall" style="animation-duration:9s;   animation-delay:-.5s"><g class="sway" style="animation-duration:2.5s"><g class="spin" style="animation-duration:4s"><use href="#petal" x="580" y="0"/></g></g></g>
      <g class="fall" style="animation-duration:11.5s;animation-delay:-6.5s"><g class="sway" style="animation-duration:3.6s"><g class="spin" style="animation-duration:7s"><use href="#petal" x="740" y="0"/></g></g></g>
      <g class="fall" style="animation-duration:12.5s;animation-delay:-2.5s"><g class="sway" style="animation-duration:2.7s"><g class="spin" style="animation-duration:5s"><use href="#petal" x="880" y="0"/></g></g></g>
    </g>
  </g>
</svg>
