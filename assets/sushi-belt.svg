<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 190" font-family="'Segoe UI', 'Hiragino Sans', sans-serif">
  <defs>
    <linearGradient id="bg3" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="100%" stop-color="#1a1023"/>
    </linearGradient>
    <linearGradient id="belt" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2d333b"/>
      <stop offset="100%" stop-color="#1c2128"/>
    </linearGradient>

    <!-- one sushi plate: nigiri -->
    <g id="nigiri">
      <ellipse cx="0" cy="16" rx="46" ry="10" fill="#e6edf3"/>
      <ellipse cx="0" cy="13" rx="46" ry="10" fill="#f8f9fa"/>
      <ellipse cx="0" cy="13" rx="46" ry="10" fill="none" stroke="#c9d1d9" stroke-width="1"/>
      <ellipse cx="0" cy="6" rx="22" ry="8" fill="#fffaf0"/>
      <path d="M-22,2 Q0,-12 22,2 Q12,8 0,7 Q-12,8 -22,2 Z" fill="#fa8072"/>
      <path d="M-16,-1 Q0,-8 16,-1" stroke="#ffb3a7" stroke-width="2" fill="none"/>
    </g>
    <!-- maki roll -->
    <g id="maki">
      <ellipse cx="0" cy="16" rx="46" ry="10" fill="#e6edf3"/>
      <ellipse cx="0" cy="13" rx="46" ry="10" fill="#f8f9fa"/>
      <ellipse cx="0" cy="13" rx="46" ry="10" fill="none" stroke="#c9d1d9" stroke-width="1"/>
      <circle cx="0" cy="2" r="13" fill="#1a2e1a"/>
      <circle cx="0" cy="2" r="9" fill="#fffaf0"/>
      <circle cx="0" cy="2" r="4" fill="#2ecc71"/>
    </g>
    <!-- tamago -->
    <g id="tamago">
      <ellipse cx="0" cy="16" rx="46" ry="10" fill="#e6edf3"/>
      <ellipse cx="0" cy="13" rx="46" ry="10" fill="#f8f9fa"/>
      <ellipse cx="0" cy="13" rx="46" ry="10" fill="none" stroke="#c9d1d9" stroke-width="1"/>
      <ellipse cx="0" cy="6" rx="22" ry="8" fill="#fffaf0"/>
      <rect x="-20" y="-8" width="40" height="12" rx="4" fill="#ffd166"/>
      <rect x="-3" y="-10" width="6" height="16" fill="#1a2e1a" opacity=".85"/>
    </g>
  </defs>

  <style>
    .beltmove  { animation: beltmove 22s linear infinite; }
    @keyframes beltmove { from { transform: translateX(0) } to { transform: translateX(-1170px) } }
    .beltlines { animation: beltlines .6s linear infinite; }
    @keyframes beltlines { to { stroke-dashoffset: -24 } }
    .steam { animation: steam 3s ease-in-out infinite; opacity: 0; }
    @keyframes steam {
      0% { transform: translateY(0); opacity:0 }
      30% { opacity:.6 }
      100% { transform: translateY(-16px); opacity:0 }
    }
  </style>

  <rect width="1000" height="190" fill="url(#bg3)" rx="12"/>
  <text x="500" y="32" text-anchor="middle" font-size="18" fill="#e6edf3" font-weight="700" letter-spacing="3">🍣 回転寿司 — SKILL CONVEYOR · ALL YOU CAN DEPLOY</text>

  <!-- steam from the kitchen -->
  <g stroke="#8b949e" stroke-width="2" fill="none" stroke-linecap="round">
    <path class="steam" d="M60,52 q4,-6 0,-12" style="animation-delay:0s"/>
    <path class="steam" d="M72,52 q-4,-6 0,-12" style="animation-delay:-1s"/>
    <path class="steam" d="M940,52 q4,-6 0,-12" style="animation-delay:-2s"/>
  </g>

  <!-- belt -->
  <rect x="0" y="130" width="1000" height="34" fill="url(#belt)"/>
  <line class="beltlines" x1="0" y1="147" x2="1000" y2="147" stroke="#444c56" stroke-width="3" stroke-dasharray="14 10"/>

  <!-- plates: two identical groups for seamless loop; set width 1170 -->
  <g class="beltmove">
    <g>
      <g transform="translate(50,108)"><use href="#nigiri"/><text x="0" y="46" text-anchor="middle" font-size="13" fill="#4cc9f0" font-weight="700">Go</text></g>
      <g transform="translate(180,108)"><use href="#maki"/><text x="0" y="46" text-anchor="middle" font-size="13" fill="#ffd166" font-weight="700">TypeScript</text></g>
      <g transform="translate(310,108)"><use href="#tamago"/><text x="0" y="46" text-anchor="middle" font-size="13" fill="#c3e88d" font-weight="700">Python</text></g>
      <g transform="translate(440,108)"><use href="#nigiri"/><text x="0" y="46" text-anchor="middle" font-size="13" fill="#ff6ec7" font-weight="700">LLM Agents</text></g>
      <g transform="translate(570,108)"><use href="#maki"/><text x="0" y="46" text-anchor="middle" font-size="13" fill="#4cc9f0" font-weight="700">React</text></g>
      <g transform="translate(700,108)"><use href="#tamago"/><text x="0" y="46" text-anchor="middle" font-size="13" fill="#ffd166" font-weight="700">GCP · Cloud Run</text></g>
      <g transform="translate(830,108)"><use href="#nigiri"/><text x="0" y="46" text-anchor="middle" font-size="13" fill="#c3e88d" font-weight="700">PostgreSQL</text></g>
      <g transform="translate(960,108)"><use href="#maki"/><text x="0" y="46" text-anchor="middle" font-size="13" fill="#ff6ec7" font-weight="700">RAG</text></g>
      <g transform="translate(1090,108)"><use href="#tamago"/><text x="0" y="46" text-anchor="middle" font-size="13" fill="#4cc9f0" font-weight="700">Docker</text></g>
    </g>
    <g transform="translate(1170,0)">
      <g transform="translate(50,108)"><use href="#nigiri"/><text x="0" y="46" text-anchor="middle" font-size="13" fill="#4cc9f0" font-weight="700">Go</text></g>
      <g transform="translate(180,108)"><use href="#maki"/><text x="0" y="46" text-anchor="middle" font-size="13" fill="#ffd166" font-weight="700">TypeScript</text></g>
      <g transform="translate(310,108)"><use href="#tamago"/><text x="0" y="46" text-anchor="middle" font-size="13" fill="#c3e88d" font-weight="700">Python</text></g>
      <g transform="translate(440,108)"><use href="#nigiri"/><text x="0" y="46" text-anchor="middle" font-size="13" fill="#ff6ec7" font-weight="700">LLM Agents</text></g>
      <g transform="translate(570,108)"><use href="#maki"/><text x="0" y="46" text-anchor="middle" font-size="13" fill="#4cc9f0" font-weight="700">React</text></g>
      <g transform="translate(700,108)"><use href="#tamago"/><text x="0" y="46" text-anchor="middle" font-size="13" fill="#ffd166" font-weight="700">GCP · Cloud Run</text></g>
      <g transform="translate(830,108)"><use href="#nigiri"/><text x="0" y="46" text-anchor="middle" font-size="13" fill="#c3e88d" font-weight="700">PostgreSQL</text></g>
      <g transform="translate(960,108)"><use href="#maki"/><text x="0" y="46" text-anchor="middle" font-size="13" fill="#ff6ec7" font-weight="700">RAG</text></g>
      <g transform="translate(1090,108)"><use href="#tamago"/><text x="0" y="46" text-anchor="middle" font-size="13" fill="#4cc9f0" font-weight="700">Docker</text></g>
    </g>
  </g>

  <text x="500" y="182" text-anchor="middle" font-size="10.5" fill="#8b949e" letter-spacing="2">GRAB A PLATE — MORE ON THE MENU: Node.js · Redis · Firestore · Promptfoo · Arize AX · E2B · AWS · CI/CD</text>
</svg>
