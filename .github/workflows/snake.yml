name: Generate Contribution Snake 🐍

on:
  schedule:
    - cron: "0 0 * * *" # every day at midnight
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Generate snake animations
        uses: Platane/snk@v3
        with:
          github_user_name: anshaneja5
          outputs: |
            dist/github-snake.svg?color_snake=#F85D7F&color_dots=#1a1b27,#2f334d,#F85D7F,#ff9e64,#c3e88d
            dist/github-snake-dark.svg?palette=github-dark&color_snake=#F85D7F

      - name: Push to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
